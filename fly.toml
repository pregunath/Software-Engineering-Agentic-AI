# Forge API on Fly.io
# Deploy from repo root: fly launch --config fly.toml  (or fly deploy)
# Attach a volume: fly volumes create forge_data --region <region> --size 10

app = "forge-api"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  AGENT_ENVIRONMENT = "production"
  AGENT_API_HOST = "0.0.0.0"
  AGENT_API_PORT = "8000"
  AGENT_PUBLIC_BASE_URL = "https://forge-api.fly.dev"
  AGENT_DATABASE_URL = "sqlite:////data/agent.db"
  AGENT_OLLAMA_BASE_URL = "http://forge-ollama.internal:11434"
  AGENT_OLLAMA_MODEL = "gemma4:e2b"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "forge_data"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
